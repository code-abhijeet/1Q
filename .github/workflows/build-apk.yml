# Builds the 1Q Android app and publishes a direct-download APK.
#
# Where to put this file in your "1q" repository:
#     .github/workflows/build-apk.yml
#
# Works whether the Android project is at the repository root or in a
# sub-folder such as 1Q-android/. Only public sources are used
# (Google Maven, Maven Central, services.gradle.org).
#
# After a successful run the APK is available:
#   - as a Release asset:  https://github.com/<your-username>/1q/releases/latest/download/1Q.apk
#   - as a workflow artifact named "1Q-apk" on the run's summary page

name: Build 1Q APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Find the Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            dir="."
          else
            found=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "./.git/*" | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::No settings.gradle found. Upload the contents of the 1Q-android folder to the repository."
              exit 1
            fi
            dir=$(dirname "$found")
          fi
          echo "Android project: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 34
        shell: bash
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use your own signing key (optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEQ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oneq.jks"
            echo "ONEQ_KEYSTORE=$RUNNER_TEMP/oneq.jks" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
          else
            echo "Signing with the bundled 1Q key (app/1q-sideload.jks)."
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          ONEQ_KEYSTORE_PASSWORD: ${{ secrets.ONEQ_KEYSTORE_PASSWORD }}
          ONEQ_KEY_ALIAS: ${{ secrets.ONEQ_KEY_ALIAS }}
          ONEQ_KEY_PASSWORD: ${{ secrets.ONEQ_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          src="${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::APK not found at $src"
            exit 1
          fi
          cp "$src" 1Q.apk
          ver=$(grep -E "versionName" "${{ steps.project.outputs.dir }}/app/build.gradle" | head -n1 | sed -E "s/.*versionName[^0-9]*([0-9.]+).*/\1/")
          echo "tag=v${ver:-1.0}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -l 1Q.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Q-apk
          path: 1Q.apk
          if-no-files-found: error

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: 1Q ${{ steps.apk.outputs.tag }}
          body: |
            Install: download **1Q.apk** on your Android phone and open it.
            Updates install over the previous version and keep your progress.
          files: 1Q.apk
          make_latest: true
