# Builds the 1Q Android app and publishes a direct-download APK.
#
# Where to put this file in your "1q" repository:
#     .github/workflows/build-apk.yml
#
# Works whether you uploaded 1Q-android.zip itself, its contents at the
# repository root, or the 1Q-android/ folder. Only public sources are used
# (Google Maven, Maven Central, services.gradle.org).
#
# After a successful run the APK is available:
#   - as a Release asset:  https://github.com/<your-username>/1q/releases/latest/download/1Q.apk
#   - as a workflow artifact named "1Q-apk" on the run's summary page

name: Build 1Q APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Find the Android project (unzips an uploaded .zip if needed)
        id: project
        shell: bash
        run: |
          find_settings() {
            find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path "./.git/*" -not -path "./_unzipped/*/.git/*" | head -n 1
          }
          found=$(find_settings)
          if [ -z "$found" ]; then
            zip=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$zip" ]; then
              echo "Unpacking $zip"
              mkdir -p _unzipped
              unzip -q -o "$zip" -d _unzipped
              found=$(find_settings)
            fi
          fi
          if [ -z "$found" ]; then
            echo "::error::No Android project found. Upload 1Q-android.zip (or its contents) to the repository."
            exit 1
          fi
          dir=$(dirname "$found")
          echo "Android project: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          # GitHub's Ubuntu runners already include the Android SDK; just add what 1Q needs.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=""
          for c in "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKM="$c"; break; fi
          done
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use your own signing key (optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEQ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oneq.jks"
            echo "ONEQ_KEYSTORE=$RUNNER_TEMP/oneq.jks" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
          else
            echo "Signing with the bundled 1Q key (app/1q-sideload.jks)."
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          ONEQ_KEYSTORE_PASSWORD: ${{ secrets.ONEQ_KEYSTORE_PASSWORD }}
          ONEQ_KEY_ALIAS: ${{ secrets.ONEQ_KEY_ALIAS }}
          ONEQ_KEY_PASSWORD: ${{ secrets.ONEQ_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          src="${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::APK not found at $src"
            exit 1
          fi
          cp "$src" 1Q.apk
          ver=$(grep -E "versionName" "${{ steps.project.outputs.dir }}/app/build.gradle" | head -n1 | sed -E "s/.*versionName[^0-9]*([0-9.]+).*/\1/")
          echo "tag=v${ver:-1.0}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -l 1Q.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Q-apk
          path: 1Q.apk
          if-no-files-found: error

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: 1Q ${{ steps.apk.outputs.tag }}
          body: |
            Install: download **1Q.apk** on your Android phone and open it.
            Updates install over the previous version and keep your progress.
          files: 1Q.apk
          make_latest: true
